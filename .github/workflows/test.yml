name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: shellcheck scripts/mentat

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnuplot bats bc jq

          curl -sfL -o /tmp/duckdb.zip \
            "https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip"
          unzip -o /tmp/duckdb.zip -d /tmp/duckdb
          chmod +x /tmp/duckdb/duckdb
          sudo mv /tmp/duckdb/duckdb /usr/local/bin/duckdb

          curl -sfL -o /tmp/qsv.zip \
            "https://github.com/jqnatividad/qsv/releases/latest/download/qsv-x86_64-unknown-linux-gnu.zip"
          if file /tmp/qsv.zip | grep -q 'Zip archive'; then
            unzip -o /tmp/qsv.zip -d /tmp/qsv
            chmod +x /tmp/qsv/qsv
            sudo mv /tmp/qsv/qsv /usr/local/bin/qsv
          else
            chmod +x /tmp/qsv.zip
            sudo mv /tmp/qsv.zip /usr/local/bin/qsv
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install duckdb qsv gnuplot bats-core jq

      - name: Run selfcheck
        run: ./scripts/mentat selfcheck

      - name: Run tests
        run: bats tests/ --verbose-run
